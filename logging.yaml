version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  auth_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/auth.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  booking_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/booking.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  center_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/center.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  center_test_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/center_test.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  diagnostic_test_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/diagnostic_test.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  payment_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/payment.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  schedule_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/schedule.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true
  user_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/user.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true

loggers:
  services.auth:
    level: INFO
    handlers: [console, auth_file]
    propagate: false
  services.booking_service:
    level: INFO
    handlers: [console, booking_file]
    propagate: false
  services.center_service:
    level: INFO
    handlers: [console, center_file]
    propagate: false
  services.center_test_service:
    level: INFO
    handlers: [console, center_test_file]
    propagate: false
  services.diagnostic_test_service:
    level: INFO
    handlers: [console, diagnostic_test_file]
    propagate: false
  services.payment_service:
    level: INFO
    handlers: [console, payment_file]
    propagate: false
  services.schedule_service:
    level: INFO
    handlers: [console, schedule_file]
    propagate: false
  services.user_service:
    level: INFO
    handlers: [console, user_file]
    propagate: false

root:
  level: INFO
  handlers: [console]